name: Deploy Backend to Lunkserver

# Only trigger when changes happen in the backend folder!
on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Connect the GitHub Runner to your Tailscale Network
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: "" # Leave blank, we use authkey
          oauth-secret: ""    # Leave blank
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          
      # 2. Now that we are on the network, SSH into Lunkserver
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LUNKSERVER_TAILSCALE_IP }}
          username: ${{ secrets.LUNKSERVER_USER }}
          key: ${{ secrets.LUNKSERVER_SSH_KEY }}
          script: |
            set -e
            echo "Connected to local Lunkserver via Tailscale!"
            cd /home/lunkman/Documents/LunkserverManager/backend/
            git fetch origin master
            git reset --hard origin/master
            source .venv/bin/activate
            pip install -r requirements.txt

            #Write secrets from GitHub Actions — never committed to the repo.
            #python-dotenv loads this on startup (no systemd drop-in needed).
            #Only write non-empty values so unset secrets fall back to defaults.
            cat > .env <<'ENVEOF'
            ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
            GUEST_TOKEN=${{ secrets.GUEST_TOKEN }}
            FRP_SERVER_ADDR=${{ secrets.FRP_SERVER_ADDR }}
            FRP_TOKEN=${{ secrets.FRP_TOKEN }}
            CF_API_KEY=${{ secrets.CF_API_KEY }}
            FACTORIO_USERNAME=${{ secrets.FACTORIO_USERNAME }}
            FACTORIO_TOKEN=${{ secrets.FACTORIO_TOKEN }}
            ENVEOF
            #Strip empty lines (secrets not yet configured) so fallbacks work.
            sed -i '/=$/d' .env

            sudo systemctl restart lunk-backend
            echo "Backend deployment complete"
