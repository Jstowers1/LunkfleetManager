name: Deploy Frontend to VPS

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /root/LunkserverManager/frontend
            git fetch origin master
            git reset --hard origin/master
            npm install
            npm run build

            #Pass tokens as env vars — SvelteKit $env/dynamic/private reads
            #process.env at runtime. --update-env forces pm2 to pick up new
            #values on restart (plain reload/restart keeps the old env).
            export ADMIN_TOKEN="${{ secrets.ADMIN_TOKEN }}"
            export GUEST_TOKEN="${{ secrets.GUEST_TOKEN }}"
            PORT=8080 pm2 delete lunk-frontend 2>/dev/null || true
            PORT=8080 pm2 start build/index.js --name lunk-frontend
