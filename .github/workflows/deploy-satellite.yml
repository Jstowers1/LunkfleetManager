name: Deploy Satellite Backend

on:
  push:
    branches:
      - master
    paths:
      - 'satellite-backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Copy satellite-backend to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: <VPS_TAILSCALE_IP>
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "satellite-backend/*"
          target: "/home/lunkman/Documents/LunkserverManager"
          rm: false

      - name: Install and restart satellite
        uses: appleboy/ssh-action@master
        with:
          host: <VPS_TAILSCALE_IP>
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/lunkman/Documents/LunkserverManager/satellite-backend
            # Ensure lunkman user exists (service runs as User=lunkman).
            id lunkman 2>/dev/null || sudo useradd -m -d /home/lunkman -s /bin/bash lunkman
            sudo chown -R lunkman:lunkman /home/lunkman/Documents/LunkserverManager/satellite-backend
            sudo apt-get update -qq && sudo apt-get install -y -qq python3.12-venv python3-pip
            rm -rf /home/lunkman/Documents/LunkserverManager/satellite-backend/.venv
            sudo -u lunkman python3 -m venv /home/lunkman/Documents/LunkserverManager/satellite-backend/.venv
            sudo -u lunkman .venv/bin/pip install --upgrade pip
            sudo -u lunkman .venv/bin/pip install -r requirements.txt
            sudo chown -R lunkman:lunkman /home/lunkman/Documents/LunkserverManager/satellite-backend

            #Write DASHBOARD_ORIGIN from GitHub Actions.
            #python-dotenv loads this on startup (no systemd drop-in needed).
            #Only write non-empty values so unset secrets fall back to defaults.
            cat > .env <<'ENVEOF'
            DASHBOARD_ORIGIN=${{ secrets.DASHBOARD_ORIGIN }}
            ENVEOF
            sed -i '/=$/d' .env
            sudo chown lunkman:lunkman .env

            sudo cp satellite.service /etc/systemd/system/satellite.service
            sudo systemctl daemon-reload
            sudo systemctl restart satellite
            sudo systemctl enable satellite
            sleep 3
            # Diagnostics: show status + recent logs so failures aren't silent.
            sudo systemctl --no-pager status satellite || true
            sudo journalctl -u satellite -n 30 --no-pager || true
            echo "Satellite backend restarted via systemd"
